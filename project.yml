name: AinkradLore
options:
  bundleIdPrefix: com.ainkrad
  deploymentTarget: { macOS: "14.0" }
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    EAGER_LINKING: NO
packages:
  AinkradAppKit:
    url: https://github.com/AhmedMElhalaby/AinkradAppKit
    revision: dd96b2daf1cd528cf4c8b77cccffbed3fb066fb3
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "6.29.3"
targets:
  LoreFeature:
    type: library.static
    platform: macOS
    sources: [Sources/LoreFeature]
    settings:
      base:
        OTHER_SWIFT_FLAGS: "-Xcc -fmodule-map-file=$(SRCROOT)/build/SourcePackages/checkouts/GRDB.swift/Sources/CSQLite/module.modulemap"
    dependencies:
      - package: GRDB
        product: GRDB
      - package: AinkradAppKit
        embed: false
  LorePlugin:
    type: bundle
    platform: macOS
    sources: [Sources/LorePlugin]
    postBuildScripts:
      # Generate AinkradAPIVersion from the SDK this build linked,
      # rather than trusting the hand-typed Info.plist value.
      - script: '"$SRCROOT/scripts/stamp-api-version.sh"'
        name: Stamp AinkradAPIVersion
        # The plist is an INPUT, not an output: declaring it makes the build
        # system order this phase after the task that copies it into the
        # bundle. Without it the script races that copy and finds nothing.
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        # No outputs, so keep it running every build: the linked SDK revision
        # can change generation without any source file changing.
        basedOnDependencyAnalysis: false
    dependencies:
      - target: LoreFeature
      - package: GRDB
        product: GRDB
      - package: AinkradAppKit
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ainkrad.plugin.lore
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/LorePlugin/Info.plist
        MACH_O_TYPE: mh_bundle
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        OTHER_LDFLAGS: ["-lLoreFeature"]
  LoreFeatureTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/LoreFeatureTests]
    dependencies:
      - target: LoreFeature
      - package: GRDB
        product: GRDB
      - package: AinkradAppKit
schemes:
  LorePlugin:
    build: { targets: { LorePlugin: all, LoreFeatureTests: [test] } }
    test:  { config: Debug, targets: [LoreFeatureTests] }
